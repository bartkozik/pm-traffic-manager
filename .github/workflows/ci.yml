name: Demo checks and deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history -m' --redact --no-banner

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: ptm
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ptm_test
        ports: [5432:5432]
        options: --health-cmd="pg_isready -U ptm -d ptm_test" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      PTM_TEST_DATABASE_URL: postgres://ptm:test-only@localhost:5432/ptm_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@8.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm --filter @ptm/domain test
      - run: pnpm --filter @ptm/web test
      - run: pnpm --filter @ptm/api exec vitest run --no-file-parallelism
      - run: pnpm --filter @ptm/mcp-server test
      - run: pnpm build
      - run: node scripts/check-demo-assets.mjs

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build demo images
        run: |
          docker build -f apps/api/Dockerfile -t "ghcr.io/$GITHUB_REPOSITORY-api:sha-$GITHUB_SHA" .
          docker build -f apps/web/Dockerfile --build-arg VITE_PTM_API_URL=/api --build-arg VITE_PTM_DEMO_ENABLED=true -t "ghcr.io/$GITHUB_REPOSITORY-web:sha-$GITHUB_SHA" .
      - name: Export images
        run: docker save "ghcr.io/$GITHUB_REPOSITORY-api:sha-$GITHUB_SHA" "ghcr.io/$GITHUB_REPOSITORY-web:sha-$GITHUB_SHA" | gzip > "$RUNNER_TEMP/images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-images
          path: ${{ runner.temp }}/images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Remove local images
        run: docker image rm "ghcr.io/$GITHUB_REPOSITORY-api:sha-$GITHUB_SHA" "ghcr.io/$GITHUB_REPOSITORY-web:sha-$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: demo-images
          path: ${{ runner.temp }}/roundtrip
      - name: Load downloaded images
        run: gzip -dc "$RUNNER_TEMP/roundtrip/images.tar.gz" | docker load
      - name: Verify guest demo images
        run: bash scripts/test-demo-images.sh "ghcr.io/$GITHUB_REPOSITORY-api:sha-$GITHUB_SHA" "ghcr.io/$GITHUB_REPOSITORY-web:sha-$GITHUB_SHA"

  publish:
    needs: [quality, secrets, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.push.outputs.api }}
      web: ${{ steps.push.outputs.web }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: demo-images
          path: ${{ runner.temp }}
      - id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gzip -dc "$RUNNER_TEMP/images.tar.gz" | docker load
          for component in api web; do
            image="ghcr.io/$GITHUB_REPOSITORY-$component:sha-$GITHUB_SHA"
            docker push "$image"
            reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            digest=${reference##*@}
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s=%s\n' "$component" "$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://traffic.kozikowski.it
    concurrency:
      group: traffic-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Deploy tested images
        env:
          API_DIGEST: ${{ needs.publish.outputs.api }}
          WEB_DIGEST: ${{ needs.publish.outputs.web }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-demo.sh
