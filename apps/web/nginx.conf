map $uri $cacheable {
 ~/env.js$                   0;
 ~\.(ico|png|svg|css|js)$    1;
}

map $cacheable $cache_control {
  1        "public, max-age=31536000";
  default  "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

map $cacheable $expire {
  1        1y;
  default  off;
}

server {
  listen 80;

  access_log  off;

  location ${RESOURCE_PATH_PREFIX}/ {
    alias /usr/share/nginx/html/;
    include /etc/nginx/mime.types;
    try_files $uri $uri/ ${RESOURCE_PATH_PREFIX}/index.html;

    add_header Cache-Control $cache_control;
    expires    $expire;
  }


  location ${RESOURCE_PATH_PREFIX}/version {
    add_header Content-Type text/plain;

    return 200 '${APP_VERSION}';
  }
}
